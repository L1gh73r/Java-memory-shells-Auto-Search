server:
  port: 7781

spring:
  application:
    name: workflow-integration-hub
  
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss

# 业务配置 (对应Python中的环境变量)
workflow:
  data:
    # 这里的默认值假设在容器中挂载了 /opt/work，对应 CodeQL 反编译输出根目录
    java-base-dir: ${JAVA_BASE_DIR:/opt/work/decompiled-with-deps}
    csv-base-dir: ${CSV_BASE_DIR:/Users/yulate/data/staticAnalysis/memory-find/dify-memory-shell-plugin/csv-data}
    json-base-dir: ${JSON_BASE_DIR:/app/atools/agent/jos_result}
    # 待分析目标应用 JAR 所在目录（容器内部路径），用于从 JAR 中直接提取 pom.xml
    jar-input-dir: ${JAR_INPUT_DIR:/app/atools/benchmarks}
  
  csv:
    default-batch-size: 50
    max-batch-size: 1000
  
  java-file:
    common-source-dirs:
      - "src/main/java"
      - "src/java"
      - "src"
      - "java"
      - "."

# n8n集成配置
n8n:
  server:
    # n8n服务器地址（从环境变量获取，默认值用于本地测试）
    host: ${N8N_HOST:192.168.215.2}
    # n8n服务器端口
    port: ${N8N_PORT:5678}
    # n8n webhook路径
    webhook_path: ${N8N_WEBHOOK_PATH:/webhook/fb80a628-9f5e-48e3-9863-775af53004a8}
    # 完整的webhook URL（如果不设置，将根据host、port和webhook_path自动生成）
    webhook_url: ${N8N_WEBHOOK_URL:}
  
  workflow:
    # 工作流名称
    name: ${N8N_WORKFLOW_NAME:showmaker-analysis-workflow}
    # 工作流超时时间（秒）
    timeout: ${N8N_WORKFLOW_TIMEOUT:3600}
    # 重试次数
    retry_count: ${N8N_RETRY_COUNT:3}
    # 重试间隔（秒）
    retry_interval: ${N8N_RETRY_INTERVAL:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.yourcompany.workflow: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"